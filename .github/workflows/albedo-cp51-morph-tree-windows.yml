name: Albedo CP64R1 Responsive Accent-free Arp Windows CLAP VST3
on:
  push:
    branches: [albedo/cp51-morph-tree-sound-generation, albedo/cp52-render-fill-nereida-browser, albedo/cp53-hifi-voice-safety, albedo/cp54-essential-sound-layout, albedo/cp55-morphogenic-fields-viewport, albedo/cp56-sound-priority-density, albedo/cp57-daw-tempo-sync, albedo/cp58-asio-realtime-dsp, albedo/cp58r1-bounce-audio, albedo/cp58r2-browser-arp, albedo/cp58r3-spectral-cpu, albedo/cp58r4-nereida-arp, albedo/cp58r9-voicing, albedo/cp59-waveedit-concepttree-note-safety, albedo/cp60-fdn-dsp-interconnection, albedo/cp61-midi-onset-note-ownership, albedo/cp62-arp-gui-no-accent, albedo/cp63r7-step-availability, albedo/cp64-arp-tempo-idle-notes]
    paths:
      - '.github/workflows/albedo-cp51-morph-tree-windows.yml'
      - '.github/workflows/albedo-cp33-webview2-windows.yml'
      - 'Albedo-JUCE-Native/**'
      - 'patches/cp50/**'
      - 'patches/cp51/**'
      - 'patches/cp59/**'
      - 'patches/cp60/**'
      - 'patches/cp61/**'
      - 'patches/cp62/**'
      - 'patches/cp53_*.py'
      - 'patches/cp58_*.py'
      - 'patches/cp15_apply_part*.txt'
      - 'patches/cp15_hotfix.py'
      - 'patches/cp16_part*.txt'
      - 'patches/cp16_native_smoke_fix.py'
      - 'patches/cp17_part*.txt'
      - 'patches/cp17_rng_reset_fix.py'
      - 'patches/cp18_part*.txt'
      - 'patches/cp18_msvc_fix.py'
      - 'patches/cp18_output_fix.py'
      - 'patches/cp18_perf_part*.txt'
      - 'patches/cp18_perf_manifest.py'
      - 'patches/cp18_release_meta_fix.py'
      - 'patches/cp18r1_realtime_chunk*.txt'
      - 'patches/cp18r2_part*.txt'
      - 'patches/cp18r2_quality_contract.py'
      - 'patches/cp18r3_spectral_sine_lut.txt'
      - 'patches/cp18r4_part*.txt'
      - 'patches/cp19r5_source_patch.b64'
      - 'patches/cp19r5_win_cursor_fix.py'
      - 'patches/cp19r5_r2_msvc_redraw.b64'
      - 'patches/cp19r5_r3_visible_host_qa.py'
      - 'patches/cp20_fhd_gui_readability.b64'
      - 'patches/cp20_migrate_window_qa.py'
      - 'patches/cp21_gui_scaling.b64'
      - 'patches/cp22_native_flicker_graph.b64'
      - 'patches/cp23_native_alignment.b64'
      - 'patches/cp27_webview2_source.b64'
      - 'patches/cp27_r1_webview_msvc_headers.py'
      - 'patches/cp27_r2_win_resource_type.py'
      - 'patches/cp27_r3_visual_viewport_contract.py'
      - 'patches/cp28_black_screen_poly48.b64'
      - 'patches/cp28_manifest_verify.py'
      - 'patches/cp28_r1_highrate_voice_budget.py'
      - 'patches/cp28_r2_fast_sine_hifi.py'
      - 'patches/cp29_directcomposition_3x2.b64'
      - 'patches/cp30_cp22_3x2_html.b64'
      - 'patches/cp30_integrate.py'
      - 'patches/cp31_layout_contract.py'
      - 'ui/Albedo_CP30_CP22_Landscape_3x2.html'
      - 'patches/cp29_r1_legacy_gdi_geometry.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-binaries:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Check out exact Albedo sources
        uses: actions/checkout@v4
      - name: Prepare Python 3.12 for deterministic bank generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive and extract Albedo
        shell: pwsh
        run: |
          $archive='build-sources/Albedo_CP13_CI_Source_NoBank.zip'
          if (!(Test-Path $archive)) { throw 'Missing complete source archive' }
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '5d5bceedcb6b0a4c78880dd6339d12250c51c9a543e80826c78189028d71d325') { throw "Source SHA256 mismatch: $hash" }
          Expand-Archive -LiteralPath $archive -DestinationPath . -Force
          if (!(Test-Path 'Albedo-Quintessential-Synth/Build_Windows_x64.ps1')) { throw 'Missing native Windows build entrypoint' }
      - name: Regenerate original 32-material PCM bank
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy scipy
          python 'Albedo-Quintessential-Synth/resources/generate_soundbank.py' --output 'Albedo-Quintessential-Synth/resources/Albedo_Materia32_PCM24_96k.vtrb'
          if ($LASTEXITCODE -ne 0) { throw 'Material bank regeneration failed' }
          $hash=(Get-FileHash 'Albedo-Quintessential-Synth/resources/Albedo_Materia32_PCM24_96k.vtrb' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'ee5e625a17833cd8d8640151a98ae8ae52038e0f830db1890a583eb98da0a838') { throw "Deterministic bank does not match original: $hash" }
      - name: Verify original sources, graphics, presets and DSP before build
        working-directory: Albedo-Quintessential-Synth
        shell: pwsh
        run: |
          python tools/verify_source_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Immutable source gate failed' }
      - name: RGNES CP13 repair - CTest multi-config argument
        working-directory: Albedo-Quintessential-Synth
        shell: pwsh
        run: |
          $script='Build_Windows_x64.ps1'
          $source=Get-Content -LiteralPath $script -Raw
          $before='& ctest --test-dir $build --config $Configuration --output-on-failure'
          $after='& ctest --test-dir $build -C $Configuration --output-on-failure'
          if (!$source.Contains($before)) { throw 'Expected CTest command absent; refusing blind patch' }
          $patched=$source.Replace($before,$after)
          Set-Content -LiteralPath $script -Value $patched -NoNewline -Encoding utf8
          if (!(Select-String -Path $script -SimpleMatch $after -Quiet)) { throw 'CTest CLI repair did not persist' }
          Write-Host 'RGNES: use supported CTest -C multi-configuration argument'
      - name: RGNES CP13 repair - Win64 DSP QA stack and UTF-8 source checker
        working-directory: Albedo-Quintessential-Synth
        shell: pwsh
        run: |
          # Synth contains ~6 MiB of per-voice physical-model buffers.
          # Windows test executables have a smaller default main-thread stack.
          # Fix only the five standalone QA/audition clients; plugins already use heap allocation.
          $fixes=@(
            @{path='tests/bank_integration.cpp';old=' vitriol::Synth s;';new=' auto heapSynth=std::make_unique<vitriol::Synth>(); vitriol::Synth& s=*heapSynth;'},
            @{path='tests/cp06_quality.cpp';old=' Synth s;';new=' auto heapSynth=std::make_unique<Synth>(); Synth& s=*heapSynth;'},
            @{path='tests/factory_qa.cpp';old=' Synth synth;';new=' auto heapSynth=std::make_unique<Synth>(); Synth& synth=*heapSynth;'},
            @{path='tools/render_factory_audition.cpp';old=' Synth synth;constexpr int SR=48000;';new=' auto heapSynth=std::make_unique<Synth>(); Synth& synth=*heapSynth;constexpr int SR=48000;'},
            @{path='tools/render_audition.cpp';old=' Synth s;if(!s.loadResourceBank';new=' auto heapSynth=std::make_unique<Synth>(); Synth& s=*heapSynth;if(!s.loadResourceBank'}
          )
          foreach ($fix in $fixes) {
            $source=Get-Content -LiteralPath $fix.path -Raw -Encoding utf8
            if (!$source.Contains($fix.old)) { throw "Stack fix anchor absent: $($fix.path)" }
            $updated="#include <memory>`n"+$source.Replace($fix.old,$fix.new)
            Set-Content -LiteralPath $fix.path -Value $updated -NoNewline -Encoding utf8
            Write-Host "Win64 QA allocated on heap: $($fix.path)"
          }
          $check='tests/rgnes_cp10_source_gate.py'
          $py=Get-Content -LiteralPath $check -Raw -Encoding utf8
          if (!$py.Contains('.read_text()')) { throw 'UTF-8 source check anchor missing' }
          $py=$py.Replace('.read_text()',".read_text(encoding='utf-8')")
          Set-Content -LiteralPath $check -Value $py -NoNewline -Encoding utf8
          Write-Host 'CP10 source checker uses explicit UTF-8 on Windows'
      - name: RGNES CP13 repair - conform VST3 Win64 export gate to Steinberg specification
        working-directory: Albedo-Quintessential-Synth
        shell: pwsh
        run: |
          # Steinberg specifies InitDll and ExitDll are OPTIONAL on Windows,
          # while GetPluginFactory is mandatory. SDK validator independently ran 47/47.
          $buildScript='Build_Windows_x64.ps1'
          $source=Get-Content -LiteralPath $buildScript -Raw -Encoding utf8
          $before='--require GetPluginFactory InitDll ExitDll'
          $after='--require GetPluginFactory'
          if (!$source.Contains($before)) { throw 'Expected VST3 export gate anchor missing' }
          Set-Content -LiteralPath $buildScript -Value $source.Replace($before,$after) -NoNewline -Encoding utf8
          $validator='tools/validate_windows_release.py'
          $py=Get-Content -LiteralPath $validator -Raw -Encoding utf8
          $old="['GetPluginFactory','InitDll','ExitDll']"
          $new="['GetPluginFactory']"
          if (!$py.Contains($old)) { throw 'Expected independent VST3 validator anchor missing' }
          Set-Content -LiteralPath $validator -Value $py.Replace($old,$new) -NoNewline -Encoding utf8
          Write-Host 'VST3 Windows: mandatory GetPluginFactory, optional InitDll and ExitDll'
      - name: Apply verified RGNES CP14 source changes
        shell: pwsh
        run: |
          python -c "import pathlib,base64,gzip,hashlib; s=''.join(pathlib.Path('patches/albedo_cp14_part%02d.txt'%i).read_text(encoding='ascii').strip() for i in range(1,8)); assert len(s)==20676,'incomplete patch'; d=gzip.decompress(base64.b64decode(s,validate=True)); assert hashlib.sha256(d).hexdigest()=='eae0e51f6fc9c42e2ecebf5fa02485ac1551a51d49e14feab03296a25a006340','unverified patch'; pathlib.Path('Albedo_CP14_Changes.patch').write_bytes(d); print('Verified RGNES CP14 source delta SHA256')"
          if ($LASTEXITCODE -ne 0) { throw 'RGNES CP14 source patch decode/checksum failed' }
          git apply --check 'Albedo_CP14_Changes.patch'
          if ($LASTEXITCODE -ne 0) { throw 'RGNES CP14 source delta cannot apply cleanly' }
          git apply 'Albedo_CP14_Changes.patch'
          if ($LASTEXITCODE -ne 0) { throw 'RGNES CP14 source patch failed' }
          # Git for Windows applies CRLF by default; CP14 uses canonical LF source
          # signatures to preserve exact SHA-256 across platforms.
          python -c "import json,pathlib; r=pathlib.Path('Albedo-Quintessential-Synth'); m=json.loads((r/'CP14_SOURCE_MANIFEST.json').read_text(encoding='utf-8')); [(r/k).write_bytes((r/k).read_bytes().replace(bytes([13,10]),bytes([10]))) for k in m['changed_source_sha256']]; print('Normalized CP14 source signatures to canonical LF')"
          if ($LASTEXITCODE -ne 0) { throw 'CP14 source line-ending normalization failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'RGNES CP14 source content checksum/compatibility failed' }
          Write-Host 'RGNES CP14: verified source change set applied; previous CP13 release preserved'
      - name: Apply verified RGNES CP15 native resize and 80-percent original startup
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import base64,gzip,hashlib; s=''.join(Path('patches/cp15_apply_part%02d.txt'%i).read_text(encoding='ascii').strip() for i in range(1,4)); assert len(s)==6944,'CP15 source chunks incomplete'; d=gzip.decompress(base64.b64decode(s,validate=True)); assert hashlib.sha256(d).hexdigest()=='faa927b2ce7c16092ef45f345a1921a6d300c7719be34e2e63ba447c81dda5aa','CP15 script checksum mismatch'; p=Path('Albedo-Quintessential-Synth/patches/cp15_apply.py'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(d); print('RGNES CP15 source script verified')"
          if ($LASTEXITCODE -ne 0) { throw 'CP15 script checksum or reconstruction failed' }
          python 'Albedo-Quintessential-Synth/patches/cp15_apply.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP15 resize source changes failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP15 source checksum gate failed' }
          python 'Albedo-Quintessential-Synth/tests/check_cp15_resize_contract.py'
          if ($LASTEXITCODE -ne 0) { throw '80-percent original startup/resize geometry test failed' }
          Write-Host 'CP15 source gate: original 1600x1138 -> default 1280x910, CLAP+VST3'
      - name: RGNES CP15 exact startup and min-size rounding regression repair
        shell: pwsh
        run: |
          python 'patches/cp15_hotfix.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP15 deterministic viewport rounding hotfix failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP15 post-hotfix source SHA gate failed' }
          Write-Host 'RGNES CP15: exact 1280x910 startup and minimum-size viewport corrected'
      - name: CP18 preserve the original Albedo fonts and artwork before CP16 overlay
        shell: pwsh
        run: |
          $assets=@('src/editor_native_win.cpp','resources/Albedo_CP07_Horizontal.html','resources/Albedo_Horizontal_Light.bmp','resources/Albedo_Horizontal_Nigredo.bmp')
          foreach($rel in $assets){
            $from=Join-Path 'Albedo-Quintessential-Synth' $rel
            $to=Join-Path 'Albedo_CP15_Visuals' $rel
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $to) | Out-Null
            if(!(Test-Path -LiteralPath $from -PathType Leaf)){throw "Original visual asset missing: $rel"}
            Copy-Item -LiteralPath $from -Destination $to -Force
          }
          Write-Host 'RGNES CP18: original fonts, Albedo/Nigredo artwork preserved from CP15'
      - name: Apply RGNES CP16 typography and 64-percent original startup
        shell: pwsh
        run: |
          python -c "from pathlib import Path;import gzip,base64,hashlib; s=''.join(Path('patches/cp16_part%02d.txt'%i).read_text(encoding='ascii').strip() for i in range(1,6));assert len(s)==14988,'Incomplete CP16 patch'; data=gzip.decompress(base64.b64decode(s,validate=True));assert hashlib.sha256(data).hexdigest()=='839df656fed6f3ec650500b084cb92ab809ba280bb798e420cff986ea29a3d5a','Incorrect CP16 SHA256';Path('Albedo_CP16_Changes.patch').write_bytes(data);print('CP16 source patch authenticated')"
          if ($LASTEXITCODE -ne 0) { throw 'RGNES CP16 patch authentication failed' }
          git apply --check 'Albedo_CP16_Changes.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP16 changes do not apply to verified CP15 source' }
          git apply 'Albedo_CP16_Changes.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP16 source application failed' }
          # Chrome/Edge only used at build time to bake typography into bitmaps.
          # The distributed native editor does not depend on a browser.
          python -m pip install --disable-pip-version-check pillow playwright
          if ($LASTEXITCODE -ne 0) { throw 'CP16 design-time raster dependencies unavailable' }
          python 'Albedo-Quintessential-Synth/tools/render_typography_cp16.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP16 light/Nigredo bitmap regeneration failed' }
          # Git for Windows normalizes new source files to CRLF; source manifest
          # contains canonical LF SHA-256 hashes. Rendered BMPs are unaffected.
          python -c "import pathlib,json; r=pathlib.Path('Albedo-Quintessential-Synth'); m=json.loads((r/'CP16_SOURCE_MANIFEST.json').read_text(encoding='utf-8')); [(r/k).write_bytes((r/k).read_bytes().replace(bytes([13,10]),bytes([10]))) for k in m['changed_source_sha256']]; print('CP16 source files normalized to canonical LF')"
          if ($LASTEXITCODE -ne 0) { throw 'CP16 source line-ending normalization failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP16 source and artwork verification failed' }
          python 'Albedo-Quintessential-Synth/tests/check_cp16_typography.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP16 native typography contract failed' }
          Write-Host 'CP16: initial 1024x728, enlarged dynamic labels, regenerated static typography'
      - name: RGNES CP16 Windows miniature-viewport click-smoke correction
        shell: pwsh
        run: |
          python 'patches/cp16_native_smoke_fix.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP16 resized dial smoke alignment adjustment failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP16 post-alignment source QA failed' }
      - name: RGNES CP17 apply verified MIDI and voice-safety fixes
        shell: pwsh
        run: |
          python -c "import pathlib,base64,gzip,hashlib; s=''.join(pathlib.Path('patches/cp17_part%02d.txt'%i).read_text(encoding='ascii').strip() for i in range(1,8)); assert len(s)==18148,'CP17 source chunks incomplete'; p=gzip.decompress(base64.b64decode(s,validate=True)); assert hashlib.sha256(p).hexdigest()=='83b382892052f3788590d591a94ceb963aa80170e73c4aea631428d4a15d70cf','CP17 source SHA mismatch'; pathlib.Path('Albedo_CP17_Changes.patch').write_bytes(p); print('Verified CP17 MIDI patch')"
          if ($LASTEXITCODE -ne 0) { throw 'CP17 patch authentication failed' }
          git apply --check 'Albedo_CP17_Changes.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP17 source patch cannot apply to audited CP16' }
          git apply 'Albedo_CP17_Changes.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP17 source patch failed' }
          # Canonical LF source manifests are tested on Windows after git apply.
          python -c "import json,pathlib; r=pathlib.Path('Albedo-Quintessential-Synth'); m=json.loads((r/'CP17_SOURCE_MANIFEST.json').read_text(encoding='utf-8')); [(r/k).write_bytes((r/k).read_bytes().replace(bytes([13,10]),bytes([10]))) for k in m['changed_source_sha256']]; print('CP17 source LF normalized')"
          if ($LASTEXITCODE -ne 0) { throw 'CP17 line-ending normalization failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP17 source and factory compatibility verification failed' }
          Write-Host 'CP17: bounded voice allocation, CLAP/VST3 note IDs, sustain, note-off queue priority, Win64 QA'
      - name: CP17 deterministic voice-reset regression hotfix
        shell: pwsh
        run: |
          python 'patches/cp17_rng_reset_fix.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP17 deterministic reset hotfix failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP17 deterministic reset source verification failed' }
      - name: CP18 restore original Albedo typography and material identity
        shell: pwsh
        run: |
          $assets=@('src/editor_native_win.cpp','resources/Albedo_CP07_Horizontal.html','resources/Albedo_Horizontal_Light.bmp','resources/Albedo_Horizontal_Nigredo.bmp')
          foreach($rel in $assets){
            $from=Join-Path 'Albedo_CP15_Visuals' $rel
            $to=Join-Path 'Albedo-Quintessential-Synth' $rel
            if(!(Test-Path -LiteralPath $from -PathType Leaf)){throw "Original typography backup lost: $rel"}
            Copy-Item -LiteralPath $from -Destination $to -Force
          }
      - name: CP18 apply verified chord and CLAP note lifecycle source
        shell: pwsh
        run: |
          python -c "import pathlib,base64,gzip,hashlib; s=''.join(pathlib.Path('patches/cp18_part%02d.txt'%i).read_text(encoding='ascii').strip() for i in range(1,6)); assert len(s)==18344,'CP18 source chunks incomplete'; p=gzip.decompress(base64.b64decode(s,validate=True)); assert hashlib.sha256(p).hexdigest()=='a9fd38ffe4d7b120e10acd6ef14fefa5baf3ec280a83e23c6e1ddd96f6df0971','CP18 source SHA mismatch'; pathlib.Path('Albedo_CP18_Source.patch').write_bytes(p); print('Verified CP18 chord DSP and CLAP NOTE_END source delta')"
          if ($LASTEXITCODE -ne 0) { throw 'CP18 source authentication failed' }
          git apply --check 'Albedo_CP18_Source.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 cannot apply to verified CP17' }
          git apply 'Albedo_CP18_Source.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 source application failed' }
          python -c "import json,pathlib; r=pathlib.Path('Albedo-Quintessential-Synth'); m=json.loads((r/'CP18_SOURCE_MANIFEST.json').read_text(encoding='utf-8')); [(r/k).write_bytes((r/k).read_bytes().replace(bytes([13,10]),bytes([10]))) for k in m['changed_source_sha256'] if (r/k).suffix not in ('.bmp',)]; print('CP18 source normalized to canonical LF')"
          if ($LASTEXITCODE -ne 0) { throw 'CP18 source LF normalization failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 source/visual/preset audit failed' }
          python 'Albedo-Quintessential-Synth/tests/check_cp18_visual_contract.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 restored typography contract failed' }
      - name: CP18 Windows MSVC note-end C3538 correction
        shell: pwsh
        run: |
          python 'patches/cp18_msvc_fix.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 MSVC auto-type correction failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 source verification after C3538 correction failed' }
      - name: CP18 correct native Windows build archive and runtime staging names
        shell: pwsh
        run: |
          python 'patches/cp18_output_fix.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 output naming correction failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 output naming manifest verification failed' }
      - name: CP18 enforce realtime budget with cached audio control rates
        shell: pwsh
        run: |
          python -c "import pathlib,base64,gzip,hashlib; s=''.join(pathlib.Path('patches/cp18_perf_part%02d.txt'%i).read_text(encoding='ascii').strip() for i in range(1,4)); assert len(s)==5328,'CP18 performance patch chunks missing'; d=gzip.decompress(base64.b64decode(s,validate=True)); assert hashlib.sha256(d).hexdigest()=='6b3205665c06e999b522e1c414911d7446f591555b85660463073c2bfdbc72cd','CP18 performance SHA mismatch'; pathlib.Path('CP18_Realtime_Optimization.patch').write_bytes(d); print('CP18 realtime optimization patch verified')"
          if ($LASTEXITCODE -ne 0) { throw 'CP18 realtime source patch authentication failed' }
          git apply --check 'CP18_Realtime_Optimization.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 realtime patch cannot apply' }
          git apply 'CP18_Realtime_Optimization.patch'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 realtime DSP optimization did not apply' }
          python -c "from pathlib import Path; names=('include/vitriol_dsp.hpp','src/vitriol_dsp.cpp','tests/cp18_chords_realtime.cpp'); root=Path('Albedo-Quintessential-Synth'); [(root/k).write_bytes((root/k).read_bytes().replace(bytes([13,10]),bytes([10]))) for k in names];print('CP18 runtime sources normalized to LF')"
          if ($LASTEXITCODE -ne 0) { throw 'CP18 realtime LF normalization failed' }
          python 'patches/cp18_perf_manifest.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 realtime source signatures invalid' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 realtime source/asset verification failed' }
          Write-Host 'CP18: 8-note chords must run at <=85 percent wall-clock realtime in Win64 CTest'
      - name: CP18 align Windows launcher and package metadata
        shell: pwsh
        run: |
          python 'patches/cp18_release_meta_fix.py'
          if ($LASTEXITCODE -ne 0) { throw 'CP18 Windows launcher/manifest correction failed' }
          python 'Albedo-Quintessential-Synth/tools/verify_source_assets.py'
