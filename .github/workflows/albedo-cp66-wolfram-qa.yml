name: Albedo CP66 Wolfram and Engine Balance QA
on:
  push:
    branches:
      - albedo/cp66-wolfram-preset-arp
    paths:
      - 'patches/cp66/**'
      - '.github/workflows/albedo-cp66-wolfram-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original 192 program input
        uses: actions/download-artifact@v4
        with:
          name: Albedo_CP51_MorphTree_192_Generation_QA
          repository: uill12/Plugins-VST-s
          run-id: 44835756139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cp51-selected
      - name: Build 192 Wolfram variants and diversify four synth generators
        shell: bash
        run: |
          set -euo pipefail
          for f in material_factory_bank.json recursive_forms_bank.json morph_expansion_bank.json; do
            cp "cp51-selected/$f" "Albedo-JUCE-Native/Metadata/$f"
          done
          python Albedo-JUCE-Native/tools/refine_registers.py Albedo-JUCE-Native/Metadata
          python patches/cp59/augment_presets.py --metadata Albedo-JUCE-Native/Metadata --selection patches/cp59/concept_tree_selection.json --report CP59_ConceptTree_Preset_QA.json
          python patches/cp60/rebalance_fx.py --metadata Albedo-JUCE-Native/Metadata --report CP60_FX_Preset_Balance_QA.json
          python patches/cp65/retimbre_bioluminal.py --metadata Albedo-JUCE-Native/Metadata --report CP65_Bioluminal_192_Generation_QA.json
          python -m py_compile patches/cp66/root_materials.py patches/cp66/wolfram_generate.py patches/cp66/balance_generators.py patches/cp66/terminal_concept_tree.py patches/cp66/timbre_identity.py patches/cp66/quality_candidates.py patches/cp66/sync_ui_schema.py patches/cp66/audit_integrity.py
          python patches/cp66/root_materials.py --metadata Albedo-JUCE-Native/Metadata --selection patches/cp59/concept_tree_selection.json --report CP66_Root_Materials_QA.json
          python patches/cp66/wolfram_generate.py --metadata Albedo-JUCE-Native/Metadata --report CP66_Wolfram_QA.json
          python patches/cp66/balance_generators.py --metadata Albedo-JUCE-Native/Metadata --report CP66_Generator_Balance_QA.json
          python patches/cp66/terminal_concept_tree.py --metadata Albedo-JUCE-Native/Metadata --report CP66_Terminal_Concept_Tree_QA.json
          python patches/cp66/quality_candidates.py --metadata Albedo-JUCE-Native/Metadata --report CP66_Instrument_Quality_Candidates_QA.json
          python patches/cp66/timbre_identity.py --metadata Albedo-JUCE-Native/Metadata --report CP66_Timbre_Identity_QA.json
          python patches/cp66/sync_ui_schema.py ui/Albedo_CP30_CP22_Landscape_3x2.html
          python patches/cp66/audit_integrity.py --metadata Albedo-JUCE-Native/Metadata --gui ui/Albedo_CP30_CP22_Landscape_3x2.html --report CP66_Real_Parameter_Audit_QA.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('Albedo-JUCE-Native/Metadata')
          names=('material_factory_bank.json','recursive_forms_bank.json','morph_expansion_bank.json')
          data=sum([json.loads((root/f).read_text()) for f in names],[])
          assert len(data)==192 and [x['index'] for x in data]==list(range(192))
          assert len({x['name'] for x in data})==192
          for p in data:
              v=p['overrides'];w=p['wolfram_generation']
              assert w['rule'] in (30,90,110,150)
              assert int(v['6031'])==w['arpeggiator_character']
              assert len(set(int(v[str(1000+32*i)]) for i in range(4)))==4
              assert 0<=float(v['1002'])<=100
          report=json.loads(Path('CP66_Terminal_Concept_Tree_QA.json').read_text())
          assert report['preset_count']==192
          assert report['noise_used_count']>0 and report['noise_off_count']>0
          roots=json.loads(Path('CP66_Root_Materials_QA.json').read_text())
          assert len(roots['root_counts'])==8
          assert len(roots['complexity_counts'])==4
          assert len({p['root_material']['primary_method'] for p in data})>=6
          assert len({p['root_material']['table_id'] for p in data})>=16
          assert any(x['active_engines']==1 for x in report['presets'])
          assert any(x['active_engines']>=3 for x in report['presets'])
          assert len({x['index'] for x in report['presets']})==192
          identity=json.loads(Path('CP66_Timbre_Identity_QA.json').read_text())
          assert identity['identity_contracts']==192
          candidate=json.loads(Path('CP66_Instrument_Quality_Candidates_QA.json').read_text())
          assert candidate['candidate_count']==1536 and candidate['preset_count']==192
          assert all(x['changed_parameters']>=6 for x in candidate['presets'])
          assert all(x['new_runtime_parameter_ids']==[] for x in candidate['presets'])
          assert all(x['identity_anchor'] for x in identity['presets'])
          print('CP66 metadata validation passed for all 192 terminal branches')
          PY
      - name: Store parameter-generation output for review
        uses: actions/upload-artifact@v4
        with:
          name: Albedo_CP66_Wolfram_192_Generation_Only
          path: |
            Albedo-JUCE-Native/Metadata/material_factory_bank.json
            Albedo-JUCE-Native/Metadata/recursive_forms_bank.json
            Albedo-JUCE-Native/Metadata/morph_expansion_bank.json
            CP66_Root_Materials_QA.json
            CP66_Wolfram_QA.json
            CP66_Generator_Balance_QA.json
            CP66_Terminal_Concept_Tree_QA.json
            CP66_Timbre_Identity_QA.json
            CP66_Instrument_Quality_Candidates_QA.json
            CP66_Real_Parameter_Audit_QA.json
          retention-days: 30
          if-no-files-found: error
