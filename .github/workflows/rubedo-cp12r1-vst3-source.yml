name: Rubedo CP12R1 VST3 Source Compile Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Rubedo-Atlas-Drumkit/checkpoints/CP12R1_VST3_Source/**'
      - '.github/workflows/rubedo-cp12r1-vst3-source.yml'
permissions:
  contents: read
jobs:
  windows-x64-source-check:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse-check local VST3 assembly helper (no Windows install or file mutation)
        shell: pwsh
        run: |
          $script = 'Rubedo-Atlas-Drumkit/checkpoints/CP12R1_VST3_Source/AssembleRubedoCP12R1VST3.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
          if($errors.Count -gt 0){ $errors | Out-String | Write-Error; throw 'Invalid assembly PowerShell syntax' }
      - name: Assemble exact CP12R1 VST3 source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'Rubedo-Atlas-Drumkit'
          New-Item -ItemType Directory -Force -Path 'build-rubedo-vst3' | Out-Null
          $names = @{
            "$p/checkpoints/CP12R1_VST3_Source/source/rubedo_vst3.c" = 'rubedo_vst3.c'
            "$p/checkpoints/CP12R1_VST3_Source/source/rubedo_gui.c" = 'rubedo_gui.c'
            "$p/checkpoints/CP12R1_Pad_Maps/source/rubedo_engine.c" = 'rubedo_engine.c'
            "$p/checkpoints/CP12R1_Pad_Maps/source/rubedo_engine.h" = 'rubedo_engine.h'
            "$p/checkpoints/CP12R1_Pad_Maps/source/rubedo_gui.h" = 'rubedo_gui.h'
            "$p/checkpoints/CP11_SkinSync/rubedo_blank_card.inc" = 'rubedo_blank_card.inc'
            "$p/checkpoints/CP12R1_VST3_Source/source/rubedo_vst3_feedback.h" = 'rubedo_vst3_feedback.h'
            "$p/checkpoints/CP12R1_VST3_Source/qa/test_midi_feedback.c" = 'test_midi_feedback.c'
            "$p/checkpoints/CP12R1_VST3_Source/qa/test_vst3_process_bridge.c" = 'test_vst3_process_bridge.c'
            "$p/checkpoints/CP12R1_VST3_Source/qa/test_vst3_audio_equivalence.c" = 'test_vst3_audio_equivalence.c'
            "$p/checkpoints/CP12R1_VST3_Source/qa/test_official_vst3_abi.c" = 'test_official_vst3_abi.c'
            "$p/checkpoints/CP12R1_VST3_Source/qa/create_synthetic_bank_diagnostic.py" = 'create_synthetic_bank_diagnostic.py'
            "$p/checkpoints/CP12R1_VST3_Source/qa/test_diagnostic_vst3_load.c" = 'test_diagnostic_vst3_load.c'
            "$p/source/win_imports.h" = 'win_imports.h'
            "$p/checkpoints/CP12R1_VST3_Source/source/vst3_min_abi.h" = 'vst3_min_abi.h'
            "$p/source/rubedo_names.inc" = 'rubedo_names.inc'
          }
          foreach($pair in $names.GetEnumerator()){
            if(!(Test-Path -LiteralPath $pair.Key)){ throw "Missing required source $($pair.Key)" }
            Copy-Item -LiteralPath $pair.Key -Destination "build-rubedo-vst3/$($pair.Value)" -Force
          }
      - name: Generate CP08 sinc coefficients (source prerequisite)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy
          python Rubedo-Atlas-Drumkit/generate_sinc_coeffs.py
          Copy-Item Rubedo-Atlas-Drumkit/source/rubedo_sinc_coeffs.inc build-rubedo-vst3/rubedo_sinc_coeffs.inc
          @(
            '#include <stddef.h>'
            'int _fltused = 0;'
            'void *memset(void *p, int value, size_t count) { volatile unsigned char *q = (volatile unsigned char *)p; for(size_t i=0;i<count;i++)q[i]=(unsigned char)value; return p; }'
          ) | Set-Content build-rubedo-vst3/fltused.c -Encoding ascii
      - name: Verify VST3 ABI against pinned official Steinberg C API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstreamSha = '93a116f7c6c52a317ec3aaee9b13789068b5234e'
          $root = "https://raw.githubusercontent.com/steinbergmedia/vst3_c_api/$upstreamSha"
          Invoke-WebRequest -Uri "$root/vst3_c_api.h" -OutFile "build-rubedo-vst3/vst3_c_api.h"
          Invoke-WebRequest -Uri "$root/LICENSE.txt" -OutFile "build-rubedo-vst3/STEINBERG_VST3_C_API_LICENSE.txt"
          Push-Location build-rubedo-vst3
          try {
            & clang -target x86_64-pc-windows-msvc -D_WIN32 -std=c11 -Wall -Wextra -Werror -fsyntax-only test_official_vst3_abi.c
            if($LASTEXITCODE -ne 0){throw 'Rubedo custom VST3 ABI layout disagrees with Steinberg C API'}
            'VST3 ABI static layout and vtable checks against Steinberg official pinned C header: PASS' | Out-File -Encoding utf8 official-abi-test-output.txt
          } finally {Pop-Location}
      - name: Run Windows x64 MIDI Learn and live-pad feedback wire regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location build-rubedo-vst3
          try {
            & clang -target x86_64-pc-windows-msvc -std=c11 -O2 -Wall -Wextra test_midi_feedback.c -o test_midi_feedback.exe
            if($LASTEXITCODE -ne 0){throw 'VST3 feedback codec test compilation failed'}
            & .\\test_midi_feedback.exe 2>&1 | Tee-Object feedback-test-output.txt
            if($LASTEXITCODE -ne 0){throw 'VST3 feedback codec regression failed'}
          } finally {Pop-Location}
      - name: Compile PE32+ x64 VST3 core (NO EMBEDDED PCM / NOT INSTALLABLE)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location build-rubedo-vst3
          try {
            foreach($file in @('rubedo_vst3.c','rubedo_engine.c','rubedo_gui.c','fltused.c')){
              & clang -target x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -fno-stack-protector -ffreestanding -c $file -o ($file + '.obj')
              if($LASTEXITCODE -ne 0){ throw "C compile failed: $file" }
            }
            & lld-link /dll /machine:x64 /entry:DllMain /subsystem:windows /out:Rubedo_CP12R1_VST3_CORE_ONLY.vst3 rubedo_vst3.c.obj rubedo_engine.c.obj rubedo_gui.c.obj fltused.c.obj kernel32.lib user32.lib gdi32.lib comdlg32.lib ucrt.lib /opt:ref /opt:icf
            if($LASTEXITCODE -ne 0){throw 'VST3 linker failed'}
            & dumpbin /exports Rubedo_CP12R1_VST3_CORE_ONLY.vst3 | Out-File -Encoding utf8 exports.txt
            if($LASTEXITCODE -ne 0){throw 'dumpbin exports failed'}
            if(!(Select-String -Path exports.txt -Pattern 'GetPluginFactory' -Quiet)){throw 'VST3 GetPluginFactory missing'}
            # Link the actual processor/editor objects into a mock-host executable.
            # It exercises VST3 outputParameterChanges and input-event callbacks,
            # without embedding the private sample bank or requiring Bitwig.
            & clang -target x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -fno-stack-protector -ffreestanding -c test_vst3_process_bridge.c -o test_vst3_process_bridge.obj
            if($LASTEXITCODE -ne 0){throw 'VST3 mock host C compilation failed'}
            & lld-link /machine:x64 /subsystem:console /entry:test_entry /out:test_vst3_process_bridge.exe test_vst3_process_bridge.obj rubedo_vst3.c.obj rubedo_engine.c.obj rubedo_gui.c.obj fltused.c.obj kernel32.lib user32.lib gdi32.lib comdlg32.lib ucrt.lib /opt:ref /opt:icf
            if($LASTEXITCODE -ne 0){throw 'VST3 mock host linking failed'}
            & .\\test_vst3_process_bridge.exe
            if($LASTEXITCODE -ne 0){throw "VST3 mock host integration failed with code $LASTEXITCODE"}
            'VST3 processor event -> host outputParameterChanges integration: PASS (source-only mock host)' | Out-File -Encoding utf8 processor-bridge-test-output.txt
            & clang -target x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -fno-stack-protector -ffreestanding -c test_vst3_audio_equivalence.c -o test_vst3_audio_equivalence.obj
            if($LASTEXITCODE -ne 0){throw 'VST3 synthetic PCM parity fixture compile failed'}
            & lld-link /machine:x64 /subsystem:console /entry:test_entry /out:test_vst3_audio_equivalence.exe test_vst3_audio_equivalence.obj rubedo_vst3.c.obj rubedo_engine.c.obj rubedo_gui.c.obj fltused.c.obj kernel32.lib user32.lib gdi32.lib comdlg32.lib ucrt.lib /opt:ref /opt:icf
            if($LASTEXITCODE -ne 0){throw 'VST3 synthetic PCM parity fixture link failed'}
            & .\\test_vst3_audio_equivalence.exe
            if($LASTEXITCODE -ne 0){throw "VST3 synthetic PCM vs canonical DSP mismatch, code $LASTEXITCODE"}
            'VST3 wrapper synthetic-PCM comparison vs canonical CP12 engine: PASS at 44.1, 48, 88.2 and 96 kHz' | Out-File -Encoding utf8 audio-wrapper-test-output.txt
            @(
             'SOURCE-ONLY BUILD, NOT AN INSTALLABLE PLUGIN'
             'This PE core lacks CP12R1 bitmap and 2304-hit PCM resource overlay.'
             'It must be assembled with the verified CP12R1 CLAP resource overlay and tested in Windows Bitwig.'
            ) | Out-File -Encoding utf8 SOURCE_ONLY_README.txt
            Get-FileHash Rubedo_CP12R1_VST3_CORE_ONLY.vst3 -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 SHA256.txt
          } finally {Pop-Location}
      - name: Generate synthetic-only VST3 bundle and test independent Windows DLL initialization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location build-rubedo-vst3
          try {
            & python create_synthetic_bank_diagnostic.py Rubedo_CP12R1_VST3_CORE_ONLY.vst3
            if($LASTEXITCODE -ne 0){throw 'Synthetic diagnostic resource assembly failed'}
            & clang -target x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -fno-stack-protector -ffreestanding -c test_diagnostic_vst3_load.c -o test_diagnostic_vst3_load.obj
            if($LASTEXITCODE -ne 0){throw 'Independent diagnostic loader compile failed'}
            & lld-link /machine:x64 /subsystem:console /entry:test_entry /out:test_diagnostic_vst3_load.exe test_diagnostic_vst3_load.obj kernel32.lib /opt:ref /opt:icf
            if($LASTEXITCODE -ne 0){throw 'Independent diagnostic loader link failed'}
            & .\\test_diagnostic_vst3_load.exe
            if($LASTEXITCODE -ne 0){throw "Synthetic VST3 DLL resource load failed: $LASTEXITCODE"}
            'Synthetic DIAGNOSTIC ONLY: LoadLibrary + GetPluginFactory + IComponent.initialize + resource load + terminate: PASS' | Out-File -Encoding utf8 synthetic-init-smoke-test-output.txt
          } finally {Pop-Location}
      - name: Archive synthetic diagnostic bundle (NOT INSTALLABLE; not the real Rubedo bank)
        uses: actions/upload-artifact@v4
        with:
          name: Rubedo_CP12R1_VST3_Synthetic_Diagnostic_NotRelease
          path: |
            build-rubedo-vst3/Rubedo_CP12R1_VST3_SYNTHETIC_DIAGNOSTIC.vst3/
            build-rubedo-vst3/DIAGNOSTIC_ONLY.txt
            build-rubedo-vst3/synthetic-init-smoke-test-output.txt
          if-no-files-found: error
      - name: Archive compile-only QA artifacts (not a plugin release)
        uses: actions/upload-artifact@v4
        with:
          name: Rubedo_CP12R1_VST3_SourceOnly_NotInstallable
          path: |
            build-rubedo-vst3/Rubedo_CP12R1_VST3_CORE_ONLY.vst3
            build-rubedo-vst3/exports.txt
            build-rubedo-vst3/SOURCE_ONLY_README.txt
            build-rubedo-vst3/SHA256.txt
            build-rubedo-vst3/feedback-test-output.txt
            build-rubedo-vst3/processor-bridge-test-output.txt
            build-rubedo-vst3/audio-wrapper-test-output.txt
            build-rubedo-vst3/official-abi-test-output.txt
          if-no-files-found: error
