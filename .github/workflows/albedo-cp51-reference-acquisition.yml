name: Albedo CP51 Reference Acquisition Only Windows
on:
  push:
    branches: [albedo/cp51-reference-acquisition-only]
    paths:
      - '.github/workflows/albedo-cp51-reference-acquisition.yml'
      - 'Albedo-JUCE-Native/tools/target/acquire_reference.py'
      - 'Albedo-JUCE-Native/tools/target/match_target.py'
      - 'Albedo-JUCE-Native/tools/target/README.txt'
      - 'Albedo-JUCE-Native/tests/check_cp51_acquisition_only.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout reference acquisition source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline acoustic-analysis dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy scipy pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Reference analysis dependencies failed' }
      - name: Test source acquisition and prevent preset/sample reconstruction
        shell: pwsh
        run: |
          python Albedo-JUCE-Native/tests/check_cp51_acquisition_only.py
          if ($LASTEXITCODE -ne 0) { throw 'Reference-acquisition-only contract failed' }
          python -m py_compile Albedo-JUCE-Native/tools/target/acquire_reference.py Albedo-JUCE-Native/tools/target/match_target.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax error' }
      - name: Build standalone Windows reference acquisition utility
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name Acquire_Reference --distpath cp51-reference-dist --workpath cp51-reference-build Albedo-JUCE-Native/tools/target/acquire_reference.py
          if ($LASTEXITCODE -ne 0) { throw 'Acquire_Reference.exe build failed' }
          if (!(Test-Path 'cp51-reference-dist/Acquire_Reference.exe')) { throw 'Missing acquisition executable' }
          & cp51-reference-dist/Acquire_Reference.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Acquisition executable smoke test failed' }
          Copy-Item Albedo-JUCE-Native/tools/target/README.txt cp51-reference-dist/README.txt
          Copy-Item Albedo-JUCE-Native/tools/target/acquire_reference.py cp51-reference-dist/acquire_reference.py
          Get-ChildItem cp51-reference-dist -File | ForEach-Object {
            Write-Host "$($_.Name) SHA256: $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Albedo_CP51_Reference_Acquisition_Only_Windows_x64
          path: cp51-reference-dist/*
          if-no-files-found: error
          retention-days: 90
