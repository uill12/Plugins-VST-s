name: Albedo CP52 Fast GUI Validation
on:
  push:
    branches: [albedo/cp52-render-fill-nereida-browser]
    paths:
      - '.github/workflows/albedo-cp52-fast-ui.yml'
      - 'Albedo-JUCE-Native/Assets/**'
      - 'Albedo-JUCE-Native/tests/check_cp52_browser*'
      - 'Albedo-JUCE-Native/Source/AlbedoWindowFit.h'
      - 'Albedo-JUCE-Native/Source/AlbedoWebViewEditor.cpp'
      - 'Albedo-JUCE-Native/CMakeLists.txt'
      - 'ui/Albedo_CP30_CP22_Landscape_3x2.html'
      - 'patches/cp51/patch_atlas_catalog.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  edge-browser:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified CP51 morph-generation metadata, not rerendering audio
        uses: actions/download-artifact@v4
        with:
          name: Albedo_CP51_MorphTree_192_Generation_QA
          repository: uill12/Plugins-VST-s
          run-id: 44835756139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cp52-selected
      - name: Expand the real 192-preset catalogue in the canonical Albedo HTML
        shell: pwsh
        run: |
          $bank = Get-ChildItem cp52-selected -Recurse -File -Filter morph_expansion_bank.json | Select-Object -First 1
          if (!$bank) { throw 'Verified CP51 morph_expansion_bank.json not found in baseline artifact' }
          python patches/cp51/patch_atlas_catalog.py ui/Albedo_CP30_CP22_Landscape_3x2.html "$($bank.FullName)" Albedo-JUCE-Native/Assets/juce_cp33_bridge.js
          if ($LASTEXITCODE -ne 0) { throw 'CP51 native 192-preset catalogue integration failed' }
      - name: Validate static browser and host integration contracts
        shell: pwsh
        run: |
          node --check Albedo-JUCE-Native/Assets/cp35_editor_geometry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check Albedo-JUCE-Native/Assets/cp52_nereida_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node Albedo-JUCE-Native/tests/check_cp52_browser.cjs --expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Albedo-JUCE-Native/tests/check_cp39_layout.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Microsoft Edge 720, 900, 1080 viewport, browser & audition
        shell: pwsh
        run: |
          python -m pip install playwright --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Albedo-JUCE-Native/tests/check_cp52_browser_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload UI reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Albedo_CP52_Edge_GUI_Window_Reference
          path: qa-cp52-screenshots/*.png
          if-no-files-found: ignore
